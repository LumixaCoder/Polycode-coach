name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: py_compile (catch SyntaxErrors)
        shell: pwsh
        run: |
          python -m py_compile lumixa.py
          foreach ($f in @("languages/python/lessons.py","languages/java/lessons.py")) { if (Test-Path $f) { python -m py_compile $f } else { Write-Host "skip $f — not on user repo" } }
          foreach ($f in @("build.py","watch_build.py","dev.py")) { if (Test-Path $f) { python -m py_compile $f } else { Write-Host "skip $f — dev-only" } }
      - name: shim sync check
        run: |
          python -c "import lesson_data, languages.python.lessons; a=lesson_data.build_lesson_sets(); b=languages.python.lessons.build_lesson_sets(); assert len(a)==len(b), 'shim vs canonical size mismatch'; print('shim OK', {k: len(v) for k,v in a.items()}, {k: len(v) for k,v in b.items()})"
      - name: pytest
        # test_gui_window_auto_closes opens a real Tk window via mainloop() — flaky/headless on GH Windows runners; skip on CI (local still runs it)
        shell: pwsh
        run: |
          if (Test-Path tests) { python -m pytest tests -q -k "not test_gui_window_auto_closes" } else { Write-Host "no tests on user repo — skip"; exit 0 }

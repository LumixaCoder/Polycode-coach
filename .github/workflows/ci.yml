name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: py_compile (catch SyntaxErrors)
        run: |
          python -m py_compile lumixa.py
          python -m py_compile build.py
          python -m py_compile watch_build.py
          python -m py_compile dev.py
          python -m py_compile languages/python/lessons.py
          python -m py_compile languages/java/lessons.py
      - name: shim sync check
        run: |
          python -c "import lesson_data, languages.python.lessons; a=lesson_data.build_lesson_sets(); b=languages.python.lessons.build_lesson_sets(); assert len(a)==len(b), 'shim vs canonical size mismatch'; print('shim OK', {k: len(v) for k,v in a.items()}, {k: len(v) for k,v in b.items()})"
      - name: pytest
        run: python -m pytest tests -q
